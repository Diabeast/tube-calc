<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007aff"/>
      <stop offset="100%" stop-color="#34c759"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Syringe -->
  <g transform="translate(256,256) scale(5.5)" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Needle -->
    <line x1="7" y1="-12" x2="13" y2="-6"/>
    <!-- Needle tip -->
    <path d="M5 -6 L9 -3 L4 -1 Z" fill="white" stroke="none"/>
    <!-- Barrel -->
    <rect x="-9" y="0" width="16" height="15" rx="2"/>
    <!-- Plunger -->
    <line x1="-1" y1="15" x2="-1" y2="21" stroke-width="2"/>
    <rect x="-5" y="20" width="8" height="3" rx="1.5" fill="white" stroke="none"/>
    <!-- Finger flanges -->
    <line x1="-9" y1="2" x2="-14" y2="2" stroke-width="2"/>
    <line x1="-9" y1="6" x2="-14" y2="6" stroke-width="2"/>
    <line x1="7" y1="2" x2="12" y2="2" stroke-width="2"/>
    <line x1="7" y1="6" x2="12" y2="6" stroke-width="2"/>
    <!-- Liquid level -->
    <line x1="-6" y1="10" x2="4" y2="10" opacity="0.5"/>
  </g>
</svg>
